<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<style>
:root{
  color-scheme:dark;
  --paper:#f4f7f5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(ellipse at 50% 70%,#0e2222 0%,#04090b 75%);
  color:var(--paper);font-family:'Courier New',Courier,monospace;font-weight:700;overflow:hidden;position:relative;
}
.intro,.final{position:absolute;inset:0 0 auto 0;display:flex;flex-direction:column;align-items:center;padding:20vh 2rem 0;text-align:center;z-index:2}
.intro p{
  margin:0 0 .5rem;opacity:0;animation:rise 1.1s ease forwards;
  text-transform:uppercase;letter-spacing:.2em;font-size:clamp(1.4rem,6vw,3rem);
}
.intro p:nth-child(1){animation-delay:.3s}
.intro p:nth-child(2){animation-delay:1s}
.intro p:nth-child(3){animation-delay:1.7s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{
  margin-top:1.6rem;padding:.9rem 2.2rem;border:1px solid #cfeee2;border-radius:999px;background:transparent;
  color:var(--paper);font:inherit;font-size:1.05rem;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 18px rgba(160,255,220,.45),inset 0 0 12px rgba(160,255,220,.2);
  opacity:0;animation:rise 1s ease 2.5s forwards;transition:background .3s,color .3s;
}
button:hover,button:focus-visible{background:#e8fff6;color:#04090b;outline:none}
.intro.gone{opacity:0;transition:opacity .8s;pointer-events:none}
.final{padding-top:5vh;pointer-events:none}
.final p.typing::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
.final p{margin:0;min-height:1.6em;font-size:clamp(.95rem,3.4vw,1.35rem);letter-spacing:.05em;max-width:36ch;line-height:1.6}
@keyframes blink{50%{opacity:0}}

svg{position:absolute;left:50%;bottom:0;height:78vh;max-width:100vw;transform:translateX(-50%);overflow:visible}
.stem{fill:none;stroke:#eef6f2;stroke-width:3.8;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease-in-out calc(.2s + var(--j)*.06s)}
.show .stem{stroke-dashoffset:0}
#stems,#lvs,#big{filter:drop-shadow(0 0 5px rgba(255,255,255,.45))}
#fls{filter:drop-shadow(0 0 9px rgba(255,255,255,.5))}
.lf{transform:translate(var(--x),var(--y)) rotate(var(--a)) scale(0);transition:transform 1s cubic-bezier(.2,1.4,.4,1) var(--t)}
.show .lf{transform:translate(var(--x),var(--y)) rotate(var(--a)) scale(1)}
.big{transform:translate(200px,470px) rotate(var(--a)) scale(0);transition:transform 1.6s cubic-bezier(.2,.9,.3,1.05) var(--t)}
.show .big{transform:translate(200px,470px) rotate(var(--a)) scale(var(--sx),var(--sy))}
.gr{transform:translate(var(--x),590px) scaleY(0);transition:transform 1.6s ease-out var(--t)}
.show .gr{transform:translate(var(--x),590px) scaleY(1)}
.pt{transform:scale(0) rotate(-30deg);transition:transform .8s cubic-bezier(.3,1.3,.4,1) calc(var(--d) + var(--n)*.08s)}
.show .pt{transform:none}
.show #bq{transform-origin:200px 520px;animation:sway 8s ease-in-out 9s infinite}
@keyframes sway{25%{transform:rotate(.8deg)}75%{transform:rotate(-.8deg)}}

.rain{position:absolute;inset:0;pointer-events:none;opacity:0;overflow:hidden}
.show .rain{opacity:1;transition:opacity 1.5s ease 4s}
.rain i{position:absolute;bottom:-4vh;width:4px;height:4px;border-radius:50%;box-shadow:0 0 7px 2px var(--g);animation:drift linear infinite}
@keyframes drift{50%{opacity:.35}to{transform:translate(var(--dx),-110vh)}}
.tiny{position:absolute;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:7pt;font-weight:400;color:rgba(244,247,245,.75);opacity:0;z-index:2}
.show .tiny{opacity:1;transition:opacity 2s ease 1s}
@media (prefers-reduced-motion:reduce){
  .intro p,button{animation-duration:.01s;animation-delay:0s}
  .stem,.lf,.big,.gr,.pt{transition-duration:.01s;transition-delay:0s}
  .show #bq,.rain i{animation:none}
}
</style>
</head>
<body>

<div class="intro" id="intro">
  <p>I have a little</p>
  <p>surprise</p>
  <p>for you</p>
  <button id="go">Open</button>
</div>

<div class="final">
  <p id="msg"></p>
</div>

<div class="rain" id="rain"></div>
<div class="tiny">Love you</div>

<svg viewBox="0 60 400 540" role="img" aria-label="A bouquet of white lilies, red, pink and white roses">
<defs>
  <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-78">
    <stop offset="0" stop-color="#cfe3a8"/><stop offset=".3" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6f7d78"/><stop offset="1" stop-color="#f4faf7"/></linearGradient>
</defs>
<g id="bq">
  <g id="grass"></g><g id="big"></g><g id="stems"></g><g id="lvs"></g><g id="fls"></g>
</g>
</svg>

<script>
var col={
  red:'--l:#e8445a;--c:#c8102e;--d:#6f0a1a',
  pink:'--l:#f9c9da;--c:#f08fb0;--d:#b9507b',
  white:'--l:#ffffff;--c:#fbf1ec;--d:#cdb8b2'
};
function P(d,f){return '<path d="'+d+'" fill="'+f+'" stroke="var(--d)" stroke-opacity=".6" stroke-width=".9" stroke-linejoin="round"/>';}
function ell(n,sc,off,f,b){
  var o='';
  for(var i=0;i<n;i++)o+='<g transform="rotate('+(i*360/n+off)+') scale('+sc+')"><g class="pt" style="--n:'+(b+i)+'"><path d="M-5-3C-30-9-35-37-15-46C-6-49 6-49 15-46C35-37 30-9 5-3Z" fill="'+f+'" stroke="var(--d)" stroke-opacity=".55" stroke-width="'+(.9/sc).toFixed(2)+'"/><path d="M-5-3C-16-12-16-26 0-30C16-26 16-12 5-3Z" fill="var(--d)" fill-opacity=".28"/><path d="M-20-42C-8-49 8-49 20-42" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6" stroke-linecap="round"/></g></g>';
  return o;
}
function rose(){
  var g=function(n,x){return '<g class="pt" style="--n:'+n+'">'+x+'</g>';};
  return g(0,P('M-34-8C-38-30-12-38 0-38C12-38 38-30 34-8C18-16-18-16-34-8Z','var(--l)'))+
    g(2,P('M-27-8C-29-28 29-28 27-8C22 10-22 10-27-8Z','var(--c)')+'<path d="M-15-12C-15-23 15-23 15-13C15-6-8-4-11-10C-11-16 6-17 6-13M-3-17C0-20 5-18 3-14" fill="none" stroke="var(--d)" stroke-width="1.4" stroke-linecap="round"/>')+
    g(4,P('M-40-4C-44 14-24 32 0 32C24 32 44 14 40-4C22 8-22 8-40-4Z','var(--c)')+'<path d="M-36 6C-30 24-14 30 0 30C14 30 30 24 36 6C20 20-20 20-36 6Z" fill="var(--d)" fill-opacity=".35"/><path d="M-40-4C-22 8 22 8 40-4" fill="none" stroke="var(--l)" stroke-width="2.4" stroke-linecap="round"/>')+
    g(6,P('M-40-4C-48-24-34-38-20-32C-28-20-24-6-12 6C-28 8-38 4-40-4Z','var(--l)'))+
    g(8,P('M40-4C48-24 34-38 20-32C28-20 24-6 12 6C28 8 38 4 40-4Z','var(--l)'));
}
function petal(a,sc,n){
  return '<g transform="rotate('+a+') scale('+sc+')"><g class="pt" style="--n:'+n+'"><path d="M0 0C14-18 16-48 0-78C-16-48-14-18 0 0Z" fill="url(#lg)" stroke="#e4d6c4" stroke-width=".8"/><path d="M0-6V-52" stroke="#e1d3bf" stroke-width="1"/></g></g>';
}
function lily(){
  var s='',a,x,y;
  for(var i=0;i<6;i++){a=(i-2.5)*16*Math.PI/180;x=(Math.sin(a)*44).toFixed(1);y=(-Math.cos(a)*44).toFixed(1);
    s+='<path d="M0 0L'+x+' '+y+'" stroke="#c9b27a" stroke-width="1.4"/><ellipse cx="'+x+'" cy="'+y+'" rx="2.6" ry="5.5" transform="rotate('+(i-2.5)*16+' '+x+' '+y+')" fill="#d9822b"/>';}
  return petal(0,1,0)+petal(60,.92,1)+petal(120,1,2)+petal(180,.92,3)+petal(240,1,4)+petal(300,.92,5)+'<g class="pt" style="--n:6">'+s+'</g>';
}
var F=[
 ['r','red',200,150,1.0,0],['l','',115,205,.66,-28],['l','',288,208,.66,26],
 ['r','pink',55,292,.88,-25],['r','white',346,292,.88,25],['r','red',140,285,.95,-18],
 ['r','pink',262,282,.95,18],['r','white',200,238,.95,0],['r','red',95,352,.85,-22],
 ['r','pink',305,355,.85,22],['l','',200,345,.6,0]
];
var OFF=[0,-24,24,-44,44,-13,13,-7,-34,34,7],st='',fl='',i,f,d,k,wx;
for(i=0;i<F.length;i++){
  f=F[i];d=(3.2+i*.25).toFixed(2);
  k=OFF[i];wx=200+k*.25;
  st+='<path class="stem" pathLength="1" style="--j:'+i+'" d="M'+(200+k*.7)+' 580Q'+(200+k*.45)+' 525 '+wx+' 470Q'+wx+' 405 '+f[2]+' '+f[3]+'"/>';
  fl+='<g style="transform:translate('+f[2]+'px,'+f[3]+'px) rotate('+f[5]+'deg) scale('+f[4]+');--d:'+d+'s;'+col[f[1]||'white']+'">'+(f[0]=='r'?rose():lily())+'</g>';
}
document.getElementById('stems').innerHTML=st;
document.getElementById('fls').innerHTML=fl;

var lv='',ps=document.querySelectorAll('#stems path'),fr=[.5,.66,.82],len,p1,p2,b,s,j,m;
for(j=0;j<ps.length;j++){
  len=ps[j].getTotalLength();
  for(m=0;m<3;m++){
    p1=ps[j].getPointAtLength(len*fr[m]);p2=ps[j].getPointAtLength(len*fr[m]+1);
    b=Math.atan2(p2.x-p1.x,-(p2.y-p1.y))*180/Math.PI;
    for(s=-1;s<=1;s+=2)lv+='<path class="lf" d="M0 0C8-6 15-17 4-32C-4-17-8-6 0 0Z" fill="url(#sg)" style="--x:'+p1.x.toFixed(1)+'px;--y:'+p1.y.toFixed(1)+'px;--a:'+(b+s*55).toFixed(0)+'deg;--t:'+(2+j*.04+fr[m]*.6).toFixed(2)+'s"/>';
  }
}
document.getElementById('lvs').innerHTML=lv;

var L=[[-64,1.3,3],[-48,1.3,3.8],[-32,1.3,4.8],[-14,1.1,5.2],[14,1.1,5.2],[32,1.3,4.8],[48,1.3,3.8],[64,1.3,3]],bg='';
for(i=0;i<L.length;i++)bg+='<path class="big" d="M0 0C12-14 12-40 0-62C-12-40-12-14 0 0Z" fill="url(#sg)" fill-opacity=".85" style="--a:'+L[i][0]+'deg;--sx:'+L[i][1]+';--sy:'+L[i][2]*.75+';--t:'+(1.4+i*.08)+'s"/>';
document.getElementById('big').innerHTML=bg;

var gr='',x,h,l;
for(i=0;i<18;i++){
  x=200+(i%2?1:-1)*(35+Math.random()*135);h=50+Math.random()*100;l=(Math.random()*40-20);
  gr+='<path class="gr" d="M-4 0Q'+(l*.4)+' '+(-h*.6)+' '+l+' '+(-h)+'Q'+(l*.4+5)+' '+(-h*.55)+' 4 0Z" fill="'+(i%3?'#2fb85a':'#1f8f43')+'" style="--x:'+x.toFixed(0)+'px;--t:'+(1+Math.random()*1.5).toFixed(2)+'s"/>';
}
document.getElementById('grass').innerHTML=gr;

var rain='',pc=['#fff3a8','#ffffff','#ffe27a'];
for(i=0;i<26;i++)rain+='<i style="left:'+(25+Math.random()*50)+'%;background:'+pc[i%3]+';--g:'+pc[i%3]+';--dx:'+(Math.random()*160-80)+'px;animation-duration:'+(9+Math.random()*9)+'s;animation-delay:-'+(Math.random()*14)+'s"></i>';
document.getElementById('rain').innerHTML=rain;

document.getElementById('go').addEventListener('click',function(){
  document.getElementById('intro').classList.add('gone');
  document.body.classList.add('show');
  var e=document.getElementById('msg'),t='I couldn’t send real flowers, so I built you some. It’s the best I could do, but I tried my best, and every bit of it is for you Malak',n=0;
  setTimeout(function w(){e.classList.add('typing');e.textContent=t.slice(0,++n);if(n<t.length)setTimeout(w,16);},6500);
});
</script>
</body>
</html>
